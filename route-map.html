<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Osaka Trip Route Map</title>
<style>
  body { background: #0f172a; display: flex; justify-content: center; padding: 40px; font-family: system-ui, sans-serif; margin: 0; }
  svg { max-width: 900px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
</style>
</head>
<body>

<svg viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="800" height="1100" fill="#0f172a" rx="16"/>
  <rect width="800" height="1100" fill="url(#grid)" rx="16"/>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a78bfa"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700" letter-spacing="1">🗾 오사카 여행 루트맵</text>
  <text x="400" y="75" text-anchor="middle" fill="#64748b" font-size="14">May 28 (Thu) — May 31 (Sun), 2026</text>

  <!-- ======================== -->
  <!-- DAY 1 — 5/28 (THU) -->
  <!-- ======================== -->

  <!-- Day 1 header -->
  <rect x="40" y="105" width="150" height="32" rx="6" fill="#083344" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="115" y="125" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="600">📅 DAY 1 — 5/28 (목)</text>

  <!-- KIX Airport -->
  <rect x="40" y="155" width="180" height="80" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="185" text-anchor="middle" fill="#22d3ee" font-size="15" font-weight="600">✈️ KIX 공항</text>
  <text x="130" y="205" text-anchor="middle" fill="#94a3b8" font-size="11">13:30 도착</text>
  <text x="130" y="220" text-anchor="middle" fill="#94a3b8" font-size="11">입국심사 + ICOCA 구매</text>

  <!-- Arrow KIX → Umeda -->
  <line x1="220" y1="195" x2="380" y2="195" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-cyan)"/>
  <rect x="260" y="177" width="100" height="18" rx="4" fill="#1e293b"/>
  <text x="310" y="190" text-anchor="middle" fill="#22d3ee" font-size="10" filter="url(#glow)">🚃 JR Haruka 50분 ¥1,800</text>

  <!-- Hotel (Umeda area) -->
  <rect x="390" y="155" width="180" height="80" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="480" y="185" text-anchor="middle" fill="#22d3ee" font-size="15" font-weight="600">🏨 Aloft Osaka Dojima</text>
  <text x="480" y="205" text-anchor="middle" fill="#94a3b8" font-size="11">키타신치역 도보 3분</text>
  <text x="480" y="220" text-anchor="middle" fill="#94a3b8" font-size="11">~15:30 체크인</text>

  <!-- Arrow Hotel → Umeda -->
  <line x1="570" y1="195" x2="680" y2="195" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Umeda explore -->
  <rect x="690" y="155" width="180" height="80" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="780" y="185" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="600">🌆 우메다 산책</text>
  <text x="780" y="205" text-anchor="middle" fill="#94a3b8" font-size="11">그랜드 프론트 오사카</text>
  <text x="780" y="220" text-anchor="middle" fill="#94a3b8" font-size="11">그랜드 그린 오사카</text>

  <!-- Dinner 1 - Omakase -->
  <rect x="390" y="270" width="220" height="80" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="500" y="298" text-anchor="middle" fill="#34d399" font-size="15" font-weight="600">🍣 저녁 1 — 오마카세</text>
  <text x="500" y="318" text-anchor="middle" fill="#94a3b8" font-size="11">Sushi Harada @ 키타신치</text>
  <text x="500" y="333" text-anchor="middle" fill="#94a3b8" font-size="11">호텔에서 도보 5분 · ¥10,000~15,000</text>

  <!-- Arrow Hotel → Dinner -->
  <line x1="480" y1="235" x2="500" y2="270" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Day separator -->
  <line x1="40" y1="380" x2="760" y2="380" stroke="#334155" stroke-width="1" stroke-dasharray="8,4"/>

  <!-- ======================== -->
  <!-- DAY 2 — 5/29 (FRI) — SHOPPING DAY -->
  <!-- ======================== -->

  <rect x="40" y="400" width="200" height="32" rx="6" fill="#4a044e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="140" y="420" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="600">📅 DAY 2 — 5/29 (금) 🛍️</text>

  <!-- Hotel start -->
  <rect x="40" y="450" width="160" height="60" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="120" y="478" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="600">🏨 호텔 출발</text>
  <text x="120" y="496" text-anchor="middle" fill="#94a3b8" font-size="11">11:00 늦잠 → 커피</text>

  <!-- Arrow to Shinsaibashi -->
  <line x1="200" y1="480" x2="310" y2="480" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <rect x="210" y="462" width="90" height="18" rx="4" fill="#1e293b"/>
  <text x="255" y="475" text-anchor="middle" fill="#a78bfa" font-size="10">🚇 지하철 10분</text>

  <!-- Shinsaibashi -->
  <rect x="320" y="445" width="190" height="75" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="415" y="471" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="600">🛍️ 신사이바시</text>
  <text x="415" y="490" text-anchor="middle" fill="#94a3b8" font-size="11">600m 쇼핑 아케이드</text>
  <text x="415" y="506" text-anchor="middle" fill="#94a3b8" font-size="11">유니클로 · 편집샵 · 백화점</text>

  <!-- Arrow to Kuromon / Lunch -->
  <line x1="510" y1="480" x2="600" y2="480" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Lunch 1 -->
  <rect x="610" y="445" width="160" height="75" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="690" y="471" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="600">🥟 점심 1</text>
  <text x="690" y="490" text-anchor="middle" fill="#94a3b8" font-size="11">Kuromon Market</text>
  <text x="690" y="506" text-anchor="middle" fill="#94a3b8" font-size="11">or Udon Sanku</text>

  <!-- Arrow down to Amerikamura -->
  <path d="M 415 520 L 415 545 L 200 545 L 200 570" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>

  <!-- Amerikamura -->
  <rect x="40" y="575" width="230" height="75" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="155" y="601" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="600">👕 아메리카무라</text>
  <text x="155" y="620" text-anchor="middle" fill="#94a3b8" font-size="11">빈티지 · 스트릿 패션 · 스니커</text>
  <text x="155" y="636" text-anchor="middle" fill="#94a3b8" font-size="11">14:00~17:00</text>

  <!-- Arrow to Dotonbori -->
  <line x1="270" y1="612" x2="380" y2="612" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Dotonbori + Dinner 2 -->
  <rect x="390" y="575" width="180" height="75" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="480" y="601" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="600">🌃 도톤보리</text>
  <text x="480" y="620" text-anchor="middle" fill="#94a3b8" font-size="11">긴코 런닝맨 · 네온사인</text>
  <text x="480" y="636" text-anchor="middle" fill="#94a3b8" font-size="11">17:00~</text>

  <!-- Arrow to Hitsumabushi dinner -->
  <line x1="570" y1="612" x2="680" y2="612" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Dinner 2 -->
  <rect x="690" y="570" width="180" height="80" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="780" y="598" text-anchor="middle" fill="#34d399" font-size="14" font-weight="600">🐟 저녁 2 — 히츠마부시</text>
  <text x="780" y="618" text-anchor="middle" fill="#94a3b8" font-size="11">Unagi Hanamidori</text>
  <text x="780" y="633" text-anchor="middle" fill="#94a3b8" font-size="11">¥3,500~5,000</text>

  <!-- Day separator -->
  <line x1="40" y1="680" x2="760" y2="680" stroke="#334155" stroke-width="1" stroke-dasharray="8,4"/>

  <!-- ======================== -->
  <!-- DAY 3 — 5/30 (SAT) -->
  <!-- ======================== -->

  <rect x="40" y="700" width="180" height="32" rx="6" fill="#4a044e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="130" y="720" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="600">📅 DAY 3 — 5/30 (토) 🏯</text>

  <!-- Osaka Castle -->
  <rect x="40" y="750" width="190" height="75" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="135" y="776" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="600">🏯 오사카성</text>
  <text x="135" y="795" text-anchor="middle" fill="#94a3b8" font-size="11">지하철 15분 · ¥600</text>
  <text x="135" y="811" text-anchor="middle" fill="#94a3b8" font-size="11">11:00~13:00</text>

  <!-- Arrow to Lunch 2 -->
  <line x1="230" y1="787" x2="340" y2="787" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Lunch 2 -->
  <rect x="350" y="750" width="180" height="75" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="440" y="776" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="600">🥞 점심 2 — 오코노미야키</text>
  <text x="440" y="795" text-anchor="middle" fill="#94a3b8" font-size="11">Kiji (우메다) or Mizuno</text>
  <text x="440" y="811" text-anchor="middle" fill="#94a3b8" font-size="11">¥1,000~2,000</text>

  <!-- Arrow to Shinsekai -->
  <line x1="530" y1="787" x2="640" y2="787" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Shinsekai -->
  <rect x="650" y="750" width="180" height="75" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="740" y="776" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="600">🍢 신세카이</text>
  <text x="740" y="795" text-anchor="middle" fill="#94a3b8" font-size="11">츠텐카쿠 · 쿠시카츠 골목</text>
  <text x="740" y="811" text-anchor="middle" fill="#94a3b8" font-size="11">14:30~17:00</text>

  <!-- Branch: two dinner options -->

  <!-- Back to hotel rest -->
  <rect x="40" y="860" width="160" height="55" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="120" y="885" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="600">🏨 호텔 휴식</text>
  <text x="120" y="901" text-anchor="middle" fill="#94a3b8" font-size="11">17:00~18:30</text>

  <line x1="200" y1="880" x2="290" y2="880" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-amber)" stroke-dasharray="4,3"/>

  <!-- Dinner 3 - Option A: Yakitori -->
  <rect x="300" y="850" width="210" height="75" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="405" y="876" text-anchor="middle" fill="#34d399" font-size="14" font-weight="600">🐔 저녁 ③-A: 야키토리</text>
  <text x="405" y="896" text-anchor="middle" fill="#94a3b8" font-size="11">Yakitori Ichimatsu @ 난바</text>
  <text x="405" y="912" text-anchor="middle" fill="#94a3b8" font-size="11">¥3,000~5,000 · 미쉐린 빕</text>

  <!-- Dinner 3 - Option B: Kushikatsu -->
  <rect x="550" y="850" width="210" height="75" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="655" y="876" text-anchor="middle" fill="#34d399" font-size="14" font-weight="600">🍢 저녁 ③-B: 쿠시카츠</text>
  <text x="655" y="896" text-anchor="middle" fill="#94a3b8" font-size="11">Kushikatsu Daruma @ 신세카이</text>
  <text x="655" y="912" text-anchor="middle" fill="#94a3b8" font-size="11">¥2,000~3,000 · 본점</text>

  <!-- Branch labels -->
  <text x="510" y="843" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">OR</text>

  <!-- Day separator -->
  <line x1="40" y1="955" x2="760" y2="955" stroke="#334155" stroke-width="1" stroke-dasharray="8,4"/>

  <!-- ======================== -->
  <!-- DAY 4 — 5/31 (SUN) — RETURN -->
  <!-- ======================== -->

  <rect x="40" y="970" width="180" height="32" rx="6" fill="#083344" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="990" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="600">📅 DAY 4 — 5/31 (일) 🏠</text>

  <!-- Checkout -->
  <rect x="40" y="1020" width="180" height="55" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="1045" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="600">🏨 체크아웃</text>
  <text x="130" y="1061" text-anchor="middle" fill="#94a3b8" font-size="11">10:00</text>

  <line x1="220" y1="1047" x2="330" y2="1047" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-cyan)"/>
  <text x="270" y="1038" text-anchor="middle" fill="#22d3ee" font-size="10">🚃 Haruka 50분</text>

  <!-- KIX return -->
  <rect x="340" y="1020" width="180" height="55" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="430" y="1045" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="600">✈️ KIX 공항</text>
  <text x="430" y="1061" text-anchor="middle" fill="#94a3b8" font-size="11">면세점 · 14:25 출발</text>

  <!-- Legend -->
  <rect x="580" y="1010" width="190" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="675" y="1030" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">범례</text>
  <rect x="590" y="1040" width="12" height="12" rx="2" fill="rgba(8, 51, 68, 0.6)" stroke="#22d3ee" stroke-width="1"/>
  <text x="610" y="1050" fill="#94a3b8" font-size="10">🔄 이동 / 교통</text>
  <rect x="590" y="1058" width="12" height="12" rx="2" fill="rgba(6, 78, 59, 0.6)" stroke="#34d399" stroke-width="1"/>
  <text x="610" y="1068" fill="#94a3b8" font-size="10">🍽️ 식사</text>

</svg>

</body>
</html>
